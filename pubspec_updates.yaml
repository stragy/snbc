# Updated dependencies for null safety and modern Flutter
# Replace in your pubspec.yaml

dependencies:
  flutter:
    sdk: flutter

  # Core networking and HTTP
  dio: ^5.9.0
  
  # UI and Layout
  flutter_screenutil: ^5.9.3
  card_swiper: ^3.0.1
  
  # WebView (fix missing WebView issues)
  webview_flutter: ^4.4.2
  
  # Video player (fix VideoPlayerController issues)
  video_player: ^2.10.0
  
  # Grid layout (fix StaggeredGridView issues)
  flutter_staggered_grid_view: ^0.7.0
  
  # Storage and persistence
  shared_preferences: ^2.2.2
  
  # File operations
  flutter_downloader: ^1.12.0
  path_provider: ^2.1.1
  
  # WeChat integration
  fluwx: ^4.1.0
  
  # UI components and pickers
  flutter_picker: ^2.1.0
  
  # Utilities
  fluttertoast: ^8.2.4
  permission_handler: ^11.1.0
  
  # State management
  provider: ^6.1.1
  
  # Image handling
  flutter_image_compress: ^2.1.0
  image_picker: ^1.0.4
  
  # Routing
  fluro: ^2.0.5
  
  # Pull to refresh
  easy_refresh: ^3.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1