plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.lecheng.baicaogarden" 
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.lecheng.baicaogarden"
        minSdkVersion flutter.minSdkVersion 
        targetSdkVersion 36
        versionCode 19
        versionName "20240727"
        multiDexEnabled true 
    }

    // 签名配置：优先从 keystore.properties 读取，未配置时使用默认值（仅限开发环境）
    def keystorePropertiesFile = rootProject.file("key.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            storeFile file("bct.jks")
            storePassword keystoreProperties.getProperty('storePassword', '123456')
            keyAlias keystoreProperties.getProperty('keyAlias', 'baicaotang')
            keyPassword keystoreProperties.getProperty('keyPassword', '123456')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // 禁用混淆和资源压缩，防止 R8 Missing Class 导致 APK 损坏
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // 移除之前错误的全局排除配置
    // configurations {
    //    all*.exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    // }

    ndkVersion "27.0.12077973"
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    // 显式引入 OkHttp，确保 fluwx 运行正常
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.github.bumptech.glide:glide:4.12.0"
    implementation "androidx.annotation:annotation:1.7.1"
    implementation "androidx.appcompat:appcompat:1.3.0"

    // 穿山甲广告 SDK (Pangle Ads)
    implementation 'com.pangle.cn:ads-sdk-pro:7.6.1.2'
}
