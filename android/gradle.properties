# JVM memory and IPv4 preference
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Gradle performance/stability
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.caching=false
org.gradle.vfs.watch=false
# Android toolchain configuration
# Removed invalid toolchain markers

# Network timeouts
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000

# AndroidX migration
android.useAndroidX=true
android.enableJetifier=true

# Disable non-ASCII path check (project path contains Chinese characters)
android.overridePathCheck=true

# Kotlin/JVM target alignment
kotlin.compiler.jvmTarget=11
kotlin.jvm.target.validation.mode=WARNING
android.ndkVersion=27.0.12077973
