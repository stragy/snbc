name: bct_flutter
description: 神农百草 - 中医药在线教育与企业管理平台
publish_to: 'none'
version: 1.0.0+19

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 核心依赖
  cupertino_icons: ^1.0.5
  shared_preferences: ^2.2.2
  dio: ^5.3.2
  intl: ^0.20.2
  
  # UI组件
  flutter_screenutil: ^5.9.0
  card_swiper: ^3.0.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_easyloading: ^3.0.5
  chewie: ^1.4.0
  
  # 工具类
  fluttertoast: ^9.0.0
  path_provider: ^2.1.1
  permission_handler: ^12.0.1
  date_format: ^2.0.7
  
  # 路由和状态管理
  fluro: ^2.0.5
  provider: ^6.0.5
  event_bus: ^2.0.0
  
  # 文件和媒体
  flutter_downloader: ^1.11.5
  flutter_image_compress: ^2.4.0
  webview_flutter: ^4.4.2
  video_player: ^2.10.0
  image_picker: ^1.0.4
  
  # 微信分享
  fluwx: ^5.7.5

  # 广告变现（穿山甲）
  flutter_pangle_ads: ^3.1.6
  
  pull_to_refresh: ^2.0.0
  
  # Web支持
  shared_preferences_web: ^2.2.2
  wakelock_plus: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
     - images/
